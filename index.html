<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Adoção muito legal</title>
</head>

<body>
    <header>

        <img id="logo_site" src="assets/logo_site.png" alt="logo_site">
        <h1>Ong muito legal</h1>

    </header>



    <main>

        <div class="formulario"></div>

        <form id="formAdoção">

            <label for="nome">Nome:</label>
            <input type="text" id="nome" placeholder="Digite seu nome">
            <br>

            <label for="email">Email:</label>
            <input type="email" id="email" placeholder="Digite seu email">
            <br>

            <label for="telefone">Telefone:</label>
            <input type="text" id="telefone" placeholder="Digite o seu telefone">
            <br>

            <label for="cpf">CPF:</label>
            <input type="text" id="cpf" placeholder="Digite o seu CPF">
            <br>

            <label for="idade">Idade:</label>
            <input type="text" id="idade" placeholder="Digite o seu idade">
            <br>

            <label for="cidade">Cidade:</label>
            <input type="text" id="cidade" placeholder="Digite a sua cidade">
            <br>

            <label for="moradia">Moradia: </label>

            <select name="moradia" id="moradia">
                <option value=""> Selecione</option>
                <option value="casa">Casa</option>
                <option value="apartamento">Apartamento</option>
            </select>
            <br>

            <section>
                <label for="quintal">Possui Quintal?</label>
                <input type="radio" name="quintal" value="sim">Sim
                <input type="radio" name="quintal" value="nao">Não
            </section>
            <br>

            <section>
                <label for="pets">Já teve pets antes</label>
                <input type="radio" name="pets" value="sim">Sim
                <input type="radio" name="pets" value="nao">Não
            </section>

            <br>
            <label for="horas">Quantas horas o animal ficara sozinho?</label>
            <input type="text" id="horas" placeholder="Quantas horas?">
            <br>
            <br>


            <label for="financeiro">Possui condições financeiras para os custos do pet?</label>
            <select id="financeiro">
                <option value="">Selecione</option>
                <option value="sim">sim</option>
                <option value="nao">não</option>
            </select>
            <br><br>

            <label>Quando decidiu adotar?</label><br>
            <input type="radio" name="decisao" value="hoje"> Decidi hoje mesmo
            <input type="radio" name="decisao" value="tempo"> Já venho planejando há tempo


            <br><br>
            <label for="motivo"><STRONG>Motivo da adoção </STRONG></label>
            <br>
            <textarea id="motivo" rows="10" cols="50" placeholder="Motivo da adoção"></textarea>
            <br>

            <br>
            <input type="checkbox" id="termo">
            <label for="termo">Clique aqui para aceitar os termos</label><br>
            <button type="submit">Enviar</button>
            <br>


            <div id="resultado"></div>


        </form>
    </main>



    <script src="javascript.js"></script>
    </form>





</body>

<footer>
    <img id="cachorrocanto" src="assets/cachorro canto.jpg" alt="">
</footer>

</html>
